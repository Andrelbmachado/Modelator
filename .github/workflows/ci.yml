name: CI

# Integração contínua do Modelator.
#
# Por enquanto compila e testa o alvo ModelatorCore (lógica pura) via SwiftPM,
# que é o que roda sem um host de app gráfico. Quando o projeto Xcode
# Multiplatform existir, adicionar aqui um job com `xcodebuild build test`
# para macOS e para o simulador de iPad (ver PLANO.md, Fase 0).

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  core-tests:
    name: ModelatorCore (SwiftPM)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Selecionar Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Versão do Swift
        run: swift --version

      - name: Build
        run: swift build

      - name: Testes
        run: swift test
